# CI = Continuous Integration.
# Gira ad ogni push su main e ad ogni Pull Request: controlla che il codice
# compili e che l'immagine Docker si costruisca. Se fallisce, la PR mostra una X rossa.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PlayGround.slnx

      - name: Build
        run: dotnet build PlayGround.slnx -c Release --no-restore

      # Quando aggiungerai un progetto di test, questo step li eseguira'
      - name: Test
        run: dotnet test PlayGround.slnx -c Release --no-build

  docker:
    name: Build immagine Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Costruisce l'immagine ma NON la pubblica: serve solo a verificare che il Dockerfile funzioni
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=0.0.0-ci.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
