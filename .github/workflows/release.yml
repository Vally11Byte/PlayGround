# Release automatica.
# Si attiva quando fai push di un tag tipo v1.2.3:
#   git tag -a v1.2.3 -m "Release 1.2.3"
#   git push origin v1.2.3
# Cosa fa:
#   1. costruisce l'immagine Docker con dentro la versione 1.2.3
#   2. la pubblica su GitHub Container Registry (ghcr.io/<utente>/<repo>)
#   3. crea la Release su GitHub con le note generate dalle PR
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # per creare la Release
  packages: write   # per pubblicare l'immagine su ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calcola i tag dell'immagine a partire dal tag git.
      # Con v1.2.3 produce: 1.2.3, 1.2, 1 e latest
      - name: Metadati immagine
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Crea GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
